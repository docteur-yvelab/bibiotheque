<div class="card mt-4">
  <div class="card-header">
    <h5>New Reservation</h5>
  </div>
  <div class="card-body">
    <!-- Error message from backend -->
    <div *ngIf="errorMessage" class="alert alert-danger d-flex align-items-center" role="alert">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-exclamation-triangle-fill me-2" viewBox="0 0 16 16">
        <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
      </svg>
      <div>
        <strong>Reservation failed:</strong> {{ errorMessage }}
      </div>
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label class="form-label">Book</label>
        <select class="form-select" [(ngModel)]="selectedBookId" name="bookId">
          <option [ngValue]="null" disabled>Select a book</option>
          <option *ngFor="let book of books" [ngValue]="book.bookId">
            {{ book.bookName }}
          </option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Member</label>
        <select class="form-select" [(ngModel)]="selectedUserId" name="userId">
          <option [ngValue]="null" disabled>Select a member</option>
          <option *ngFor="let user of users" [ngValue]="user.userId">
            {{ user.name }}
          </option>
        </select>
      </div>

      <button type="submit" class="btn btn-success" [disabled]="!isFormValid">
        Create Reservation
      </button>
    </form>
  </div>
</div>
