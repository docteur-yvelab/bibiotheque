<div class="container page-reservations">
  <div class="d-flex flex-wrap justify-content-between align-items-center mb-3">
    <div>
      <h1 class="page-titre">Gestion des réservations</h1>
      <p class="page-sous-titre text-muted">
        Suivi des réservations de livres — créées côté serveur avec une expiration à 7 jours (RG-04).
      </p>
    </div>
    <div class="filtre-statut">
      <label for="filtre-statut" class="form-label me-2 mb-0">Filtrer par statut</label>
      <select id="filtre-statut"
              class="form-select"
              [value]="filtreStatut"
              (change)="onFiltreStatut($any($event.target).value)">
        <option value="">Tous</option>
        <option value="EN_ATTENTE">En attente</option>
        <option value="DISPONIBLE">Disponible</option>
        <option value="ANNULEE">Annulée</option>
        <option value="EXPIREE">Expirée</option>
        <option value="HONOREE">Honorée</option>
      </select>
    </div>
  </div>

  <app-reservation-form (creee)="onReservationCreee()"></app-reservation-form>

  <div class="card liste-card">
    <div class="card-body">
      <app-reservation-list
        [reservations]="reservations"
        [etat]="etat"
        (reessayer)="chargerReservations()"
        (annuler)="onReservationAnnulee($event)">
      </app-reservation-list>
    </div>
  </div>
</div>
