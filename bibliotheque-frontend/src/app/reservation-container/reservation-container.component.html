<div class="container-fluid reservation-container" style="margin-top: 20px;">
  <h2>Reservations</h2>

  <!-- Loading state -->
  <div *ngIf="loading" class="text-center" style="margin-top: 40px;">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p style="margin-top: 10px;">Loading reservations, please wait...</p>
  </div>

  <!-- Global error banner -->
  <div *ngIf="!loading && error" class="alert alert-danger reservation-alert" role="alert">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-exclamation-triangle-fill alert-icon" viewBox="0 0 16 16">
      <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
    </svg>
    <div class="alert-text flex-grow-1">
      <strong>Error:</strong> {{ error }}
    </div>
    <button class="btn btn-sm btn-outline-danger alert-btn" (click)="loadReservations()">
      Retry
    </button>
  </div>

  <!-- Success banner -->
  <div *ngIf="successMessage" class="alert alert-success reservation-alert" role="alert">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-check-circle-fill alert-icon" viewBox="0 0 16 16">
      <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
    </svg>
    <div class="alert-text">{{ successMessage }}</div>
  </div>

  <!-- Data state (list + form) -->
  <div *ngIf="!loading && !error">
    <!-- Empty state -->
    <div *ngIf="reservations.length === 0" class="alert alert-info reservation-alert">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-info-circle-fill alert-icon" viewBox="0 0 16 16">
        <path d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16zm.93-9.412-1 4.705c-.07.34.029.533.304.533.194 0 .487-.07.686-.246l-.088.416c-.287.346-.92.598-1.465.598-.703 0-1.002-.422-.808-1.319l.738-3.468c.064-.293.006-.399-.287-.399l-.25-.002.147-.371h.003z"/>
        <path d="M8 5.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2z"/>
      </svg>
      <div class="alert-text">
        <strong>No reservations found.</strong> There are currently no reservations in the system. You can create one using the form below.
      </div>
    </div>

    <!-- List component -->
    <app-reservation-list
      *ngIf="reservations.length > 0"
      [reservations]="reservations"
      [books]="books"
      [users]="users"
      (cancelled)="onReservationCancelled($event)">
    </app-reservation-list>

    <!-- Form component -->
    <app-reservation-form
      [books]="books"
      [users]="users"
      [errorMessage]="formError"
      (created)="onReservationCreated($event)">
    </app-reservation-form>
  </div>
</div>
