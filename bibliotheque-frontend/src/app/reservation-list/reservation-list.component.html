<div class="mb-3">
  <label class="form-label"><strong>Filter by status:</strong></label>
  <select class="form-select" style="width: auto; display: inline-block; margin-left: 10px;"
          (change)="onFilterChange($any($event.target).value)">
    <option value="ALL">All</option>
    <option value="EN_ATTENTE">EN_ATTENTE</option>
    <option value="DISPONIBLE">DISPONIBLE</option>
    <option value="ANNULEE">ANNULEE</option>
    <option value="EXPIREE">EXPIREE</option>
    <option value="HONOREE">HONOREE</option>
  </select>
</div>

<table class="table table-success table-striped">
  <thead>
    <tr>
      <th>Book Title</th>
      <th>Member</th>
      <th>Status</th>
      <th>Reservation Date</th>
      <th>Expiration Date</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let r of filteredReservations">
      <td>{{ r.book?.bookName }}</td>
      <td>{{ r.user?.name }}</td>
      <td>{{ r.status }}</td>
      <td>{{ r.reservationDate }}</td>
      <td>{{ r.expirationDate }}</td>
      <td>
        <button *ngIf="canCancel(r.status)"
                class="btn btn-danger btn-sm"
                (click)="confirmCancel(r.reservationId)">
          Cancel
        </button>
      </td>
    </tr>
  </tbody>
</table>
